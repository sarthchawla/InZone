# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "dynamic worktree env"

[setup]
script = '''
set -euo pipefail

BRANCH="${BRANCH:-$(basename "$CODEX_WORKTREE_PATH")}"
SOURCE="${SOURCE:-master}"

pnpm install --frozen-lockfile
pnpm worktree:setup --branch "$BRANCH" --source "$SOURCE" --path "$CODEX_WORKTREE_PATH" --no-open

cd "$CODEX_WORKTREE_PATH"
pnpm install --frozen-lockfile
'''

[cleanup]
script = '''
set -euo pipefail

BRANCH="${BRANCH:-$(basename "$CODEX_WORKTREE_PATH")}"

pnpm worktree:cleanup "$BRANCH" --force || pnpm worktree:cleanup --sync --force
'''

[[actions]]
name = "debug"
icon = "debug"
command = "pnpm dev"

[[actions]]
name = "run"
icon = "run"
command = "pnpm dev"

[[actions]]
name = "run tests"
icon = "test"
command = "pnpm test"

[[actions]]
name = "lint"
icon = "tool"
command = "pnpm lint"

[[actions]]
name = "seed db"
icon = "tool"
command = "pnpm run db:seed"
