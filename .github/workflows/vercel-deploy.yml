# Production credentials belong to the GitHub Production environment.
name: Vercel Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    outputs:
      deployment-url: ${{ steps.deploy-production.outputs.url }}

    steps:
      - name: Verify production credentials
        env:
          NEON_PRODUCTION_DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          VERCEL_PRODUCTION_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
        run: |
          : "${NEON_PRODUCTION_DIRECT_URL:?Missing Production database connection}"
          : "${VERCEL_PRODUCTION_TOKEN:?Missing Production Vercel token}"
          : "${VERCEL_ORG_ID:?Missing Vercel organization ID}"
          : "${VERCEL_PROJECT_ID:?Missing Vercel project ID}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Production environment
        env:
          VERCEL_PRODUCTION_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_PRODUCTION_TOKEN"

      - name: Run Prisma migrations and seed database
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
        run: |
          pnpm prisma migrate deploy
          pnpm prisma db seed

      - name: Build project for production
        env:
          VERCEL_PRODUCTION_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
        run: vercel build --prod --token="$VERCEL_PRODUCTION_TOKEN"

      - name: Deploy to production
        id: deploy-production
        env:
          VERCEL_PRODUCTION_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_PRODUCTION_TOKEN")
          : "${URL:?Vercel did not return a deployment URL}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

  smoke-test:
    name: Smoke Test
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_URL: ${{ needs.deploy.outputs.deployment-url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Wait for deployment to stabilize
        run: sleep 15

      - name: Health check
        run: |
          CURL_ARGS=(--max-time 30 --retry 3 --retry-delay 5)
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            CURL_ARGS+=(-H "x-vercel-protection-bypass:$VERCEL_AUTOMATION_BYPASS_SECRET")
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${CURL_ARGS[@]}" "$DEPLOY_URL/api/health")
          echo "Health endpoint status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Verify frontend loads
        run: |
          CURL_ARGS=(--max-time 30 --retry 3 --retry-delay 5)
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            CURL_ARGS+=(-H "x-vercel-protection-bypass:$VERCEL_AUTOMATION_BYPASS_SECRET")
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${CURL_ARGS[@]}" "$DEPLOY_URL")
          echo "Frontend status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Frontend load check failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Verify protected routes require auth
        run: |
          CURL_ARGS=(--max-time 30)
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            CURL_ARGS+=(-H "x-vercel-protection-bypass:$VERCEL_AUTOMATION_BYPASS_SECRET")
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${CURL_ARGS[@]}" "$DEPLOY_URL/api/boards")
          echo "Protected route status (expected 401): $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 401 ]; then
            echo "Warning: Expected 401 for unauthenticated request, got $HTTP_STATUS"
          fi
